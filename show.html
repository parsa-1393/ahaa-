<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      .message {
        position: relative;
        z-index: 1;
        width: 320px;
        padding: 20px;
        text-align: center;
        color: white;
        font-family: Tahoma, sans-serif;
        font-size: 23px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 20px;
      }
    </style>
  </head>

  <body>
    <img src="./mygif.gif" alt="GIF" />

    <div class="message">
      من سییگما نیستم؟؟ د آخه بدبخت من سیگما نباشم دیگه تو که هوا هم نیستی
    </div>
  </body>
</html>
